name: build

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --config Release

      - name: Upload VST3 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Helios69WDF-${{ matrix.os }}-VST3
          if-no-files-found: error
          path: |
            build/**/VST3/**/*.vst3
            build/**/VST3/**/*.vst3/**
